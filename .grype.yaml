      5.x copies by @redocly/openapi-core 1.34 (via @mojaloop/api-snippets) and filelist (jake, via shins).
      Dev/lint/release tooling only, not reachable at runtime. Mirrors the audit-ci.jsonc allowlist entry (expiry
      2026-12-31). Also matches minimatch 10.2.5 bundled in npm in the base image node:24.22.2-alpine3.24 (moderate
      severity)
