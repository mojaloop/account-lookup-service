  - vulnerability: GHSA-g8qq-57p8-ggw5
    include-aliases: true
    reason: >-
      sanitize-html 2.17.5: stored XSS via SVG SMIL URI-list scheme-policy bypass (moderate). Held at 2.17.5 at the root
      and under shins because 2.17.6+ pulls ESM-only htmlparser2 12, which jest 29 (pinned in .ncurc.yaml) cannot load.
      Reachable at runtime: src/plugins.js registers the central-services-shared APIDocumentation plugin at startup when
      API_DOC_ENDPOINTS_ENABLED is on (the default), but its only input is the service's own OpenAPI document. Mirrors
      audit-ci.jsonc (expiry 2027-01-31); move to 2.18 once jest 30 is unblocked.
